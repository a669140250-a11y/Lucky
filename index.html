<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F3F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16151A" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="现在干嘛？真心话还是大冒险？交给 Lucky 帮你抽一张！">
  <title>Lucky 抽一下</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="daily">
  <div class="bg" aria-hidden="true">
    <div class="bg-layer bg-daily"></div>
    <div class="bg-layer bg-party"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">🍀</span>
        <span class="brand-name">Lucky<small>抽一下</small></span>
      </div>
      <button class="pill-btn" id="openBank" type="button">
        <span aria-hidden="true">📝</span> 自定义题库
      </button>
    </header>

    <div class="mode-switch" role="tablist" aria-label="模式切换">
      <span class="mode-indicator" aria-hidden="true"></span>
      <button class="mode-tab" id="tab-daily" type="button" role="tab" data-mode="daily"
              aria-controls="panel-daily" aria-selected="true">
        <span class="mode-emoji" aria-hidden="true">☀️</span>
        <span class="mode-text"><strong>现在干嘛</strong><small>单人日常灵感</small></span>
      </button>
      <button class="mode-tab" id="tab-party" type="button" role="tab" data-mode="party"
              aria-controls="panel-party" aria-selected="false" tabindex="-1">
        <span class="mode-emoji" aria-hidden="true">🎉</span>
        <span class="mode-text"><strong>真心话大冒险</strong><small>多人聚会</small></span>
      </button>
    </div>

    <main>
      <!-- 现在干嘛 -->
      <section class="panel" id="panel-daily" role="tabpanel" aria-labelledby="tab-daily">
        <div class="panel-head">
          <h1>现在，来点小任务？</h1>
          <p>抽一张日常微任务，给生活一点小惊喜</p>
        </div>

        <div class="deck">
          <article class="task-card is-empty" id="taskCard">
            <div class="task-meta">
              <span class="chip" id="taskCat">分类</span>
              <span class="chip chip-time" id="taskTime">⏱ 1 分钟</span>
            </div>
            <div class="task-emoji" id="taskEmoji" aria-hidden="true">🎁</div>
            <p class="task-text" id="taskText">按下面的按钮，抽出今天的第一个小任务！</p>
            <span class="stamp" aria-hidden="true">DONE!</span>
          </article>
        </div>

        <div class="actions">
          <div class="action-row" id="dailyActions">
            <button class="btn btn-soft btn-done" id="doneDaily" type="button" tabindex="-1" aria-hidden="true" disabled>
              <span class="btn-icon" aria-hidden="true">✅</span><span class="btn-label">完成</span>
            </button>
            <button class="btn btn-primary btn-xl" id="drawDaily" type="button">
              <span class="btn-icon" aria-hidden="true">🎲</span><span class="btn-label">抽一张</span>
            </button>
          </div>
        </div>
        <p class="stat">已完成 <b id="doneCount">0</b> 个小任务</p>
      </section>

      <!-- 真心话大冒险 -->
      <section class="panel" id="panel-party" role="tabpanel" aria-labelledby="tab-party" hidden>
        <div class="panel-head">
          <h1>真心话 or 大冒险？</h1>
          <p>选好类型和尺度，翻开命运的那张牌</p>
        </div>

        <div class="picker">
          <div class="type-picker" role="group" aria-label="题目类型">
            <button class="type-tile" type="button" data-type="truth" aria-pressed="true">
              <span class="t-emoji" aria-hidden="true">💬</span><span class="t-text"><b>真心话</b><small>Truth</small></span>
            </button>
            <button class="type-tile" type="button" data-type="dare" aria-pressed="false">
              <span class="t-emoji" aria-hidden="true">🔥</span><span class="t-text"><b>大冒险</b><small>Dare</small></span>
            </button>
          </div>
          <div class="seg level-picker" id="levelPicker" data-level="normal" role="group" aria-label="尺度等级">
            <span class="seg-indicator" aria-hidden="true"></span>
            <button type="button" data-level="normal" aria-pressed="true">🌱 普通</button>
            <button type="button" data-level="advanced" aria-pressed="false">🌶️ 进阶</button>
          </div>
        </div>

        <div class="flip-stage">
          <div class="flip-card" id="flipCard" data-type="truth" role="button" tabindex="0" aria-label="翻牌">
            <div class="flip-inner">
              <div class="face face-cover">
                <div class="cover-ring"><span class="cover-q">?</span></div>
                <p class="cover-title" id="coverTitle">真心话</p>
                <p class="cover-sub" id="coverSub">🌱 普通 · 点我翻牌</p>
              </div>
              <div class="face face-content" id="faceContent" data-qtype="truth" aria-hidden="true">
                <div class="content-badges">
                  <span class="badge" id="qType">💬 真心话</span>
                  <span class="badge" id="qLevel">🌱 普通</span>
                  <span class="badge badge-custom" id="qCustom" hidden>✏️ 自定义</span>
                </div>
                <p class="q-text" id="qText"></p>
                <p class="q-foot" id="qFoot">No. 01</p>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary btn-xl" id="drawParty" type="button">
            <span class="btn-icon" aria-hidden="true">🃏</span><span class="btn-label">翻牌！</span>
          </button>
        </div>
        <p class="hint">玩得开心也要尊重彼此，任何人都可以说“Pass”🙌</p>
      </section>
    </main>

    <footer class="foot">自定义题目只存在这台设备的浏览器里，记得偶尔导出备份 💾</footer>
  </div>

  <!-- 自定义题库 -->
  <dialog class="sheet" id="bankSheet" aria-labelledby="bankTitle">
    <div class="sheet-head">
      <h2 id="bankTitle">📝 自定义题库</h2>
      <button class="close-btn" id="closeBank" type="button" aria-label="关闭">✕</button>
    </div>

    <div class="sheet-body">
      <div class="seg seg-cat" id="bankCatSeg" role="group" aria-label="题库分类">
        <button type="button" data-cat="daily">☀️ 现在干嘛</button>
        <button type="button" data-cat="truth">💬 真心话</button>
        <button type="button" data-cat="dare">🔥 大冒险</button>
      </div>
      <div class="seg" id="bankLevelSeg" role="group" aria-label="尺度等级">
        <button type="button" data-level="normal">🌱 普通</button>
        <button type="button" data-level="advanced">🌶️ 进阶</button>
      </div>

      <form class="add-form" id="addForm">
        <label class="sr-only" for="addInput">添加题目</label>
        <textarea id="addInput" rows="3" maxlength="3000"></textarea>
        <div class="add-row">
          <small>一行一题，可以一次粘贴很多题</small>
          <button class="btn btn-primary" type="submit">＋ 添加</button>
        </div>
      </form>

      <div class="list-head">
        <h3>我的题目 <span class="count" id="bankCount">0</span></h3>
        <span class="muted" id="builtinCount"></span>
      </div>
      <ul class="bank-list" id="bankList"></ul>
      <p class="empty" id="bankEmpty">还没有自定义题目，写下你的第一题吧 ✍️</p>

      <label class="switch-row">
        <span>
          <b>只抽我的自定义题目</b>
          <small>打开后只从自定义题库抽；若该分类还没有自定义题目，会先用内置题库。</small>
        </span>
        <input type="checkbox" class="switch" id="onlyCustom">
      </label>

      <div class="bank-tools">
        <button class="btn btn-ghost" id="exportBank" type="button">⬇️ 导出备份</button>
        <button class="btn btn-ghost" id="importBank" type="button">⬆️ 导入</button>
        <button class="btn btn-ghost danger" id="clearCat" type="button">🗑️ 清空此分类</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-msg"></span>
    <button class="toast-action" type="button" hidden></button>
  </div>
  <div class="confetti-layer" id="confetti" aria-hidden="true"></div>
  <p class="sr-only" id="announcer" aria-live="polite"></p>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
